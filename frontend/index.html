<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Dev Card Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #79c0ff, #c9d1d9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subheading {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
        }

        input {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #216e39;
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading Skeleton */
        .skeleton {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            width: 400px;
            margin: 0 auto;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }

        .skeleton-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .skeleton-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--border-color);
            margin-right: 16px;
        }

        .skeleton-title {
            height: 24px;
            width: 150px;
            background: var(--border-color);
            border-radius: 4px;
        }

        .skeleton-line {
            height: 16px;
            background: var(--border-color);
            border-radius: 4px;
            margin-bottom: 12px;
        }

        /* Result Area */
        #result-container {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #result-content {
            margin-bottom: 1.5rem;
        }

        .share-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .share-btn:hover {
            background-color: #30363d;
        }

        .error-message {
            display: none;
            color: #f85149;
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.4);
            padding: 12px;
            border-radius: 6px;
            margin-top: 1rem;
        }

        .success-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #238636;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>GitHub Dev Card Generator</h1>
        <p class="subheading">Enter any public GitHub username</p>

        <div class="input-group">
            <input type="text" id="username" placeholder="e.g. torvalds"
                onkeydown="if(event.key==='Enter') generateCard()">
            <button id="generate-btn" onclick="generateCard()">Generate Card</button>
        </div>

        <div id="error" class="error-message"></div>

        <div id="loading" class="skeleton">
            <div class="skeleton-header">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-title"></div>
            </div>
            <div class="skeleton-line" style="width: 100%;"></div>
            <div class="skeleton-line" style="width: 80%;"></div>
            <div class="skeleton-line" style="width: 60%; margin-top: 20px;"></div>
        </div>

        <div id="result-container">
            <div id="result-content"></div>
            <button class="share-btn" id="share-btn" onclick="copyToClipboard()">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path
                        d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z">
                    </path>
                    <path
                        d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z">
                    </path>
                </svg>
                Copy Share Link
            </button>
        </div>
    </div>

    <div id="toast" class="success-toast">Link copied to clipboard!</div>

    <script>
        let currentCardUrl = '';
        const BACKEND_URL = 'http://127.0.0.1:8080';

        async function generateCard() {
            const usernameInput = document.getElementById('username');
            const username = usernameInput.value.trim();
            const generateBtn = document.getElementById('generate-btn');
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');
            const resultContainer = document.getElementById('result-container');
            const resultContent = document.getElementById('result-content');

            if (!username) return;

            // Reset UI
            errorDiv.style.display = 'none';
            resultContainer.style.display = 'none';
            loadingDiv.style.display = 'block';
            generateBtn.disabled = true;

            try {
                const response = await fetch(`${BACKEND_URL}/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.detail || 'User not found or API error');
                }

                const data = await response.json();

                // Fetch the actual HTML content from the saved card
                const cardRes = await fetch(`${BACKEND_URL}/card/${username}`);
                const htmlContent = await cardRes.text();

                resultContent.innerHTML = htmlContent;
                currentCardUrl = `${BACKEND_URL}/card/${username}`;

                loadingDiv.style.display = 'none';
                resultContainer.style.display = 'flex';
            } catch (err) {
                loadingDiv.style.display = 'none';
                errorDiv.innerText = `Error: ${err.message}`;
                errorDiv.style.display = 'block';
            } finally {
                generateBtn.disabled = false;
            }
        }

        function copyToClipboard() {
            if (!currentCardUrl) return;
            navigator.clipboard.writeText(currentCardUrl).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
            });
        }
    </script>
</body>

</html>
