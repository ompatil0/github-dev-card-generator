services:
  backend:
    build: ./backend
    container_name: devcard-backend
    ports:
      - "8080:8080"
    env_file:
      - backend/.env
    volumes:
      - ./backend/static:/app/static
    restart: always

  frontend:
    build: ./frontend
    container_name: devcard-frontend
    ports:
      - "3000:80"
    environment:
      - BACKEND_URL=http://localhost:8080
    depends_on:
      - backend
    restart: always
